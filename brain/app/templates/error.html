{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block body %}
<h1>{% if status == 404 %}Not found{% elif status == 403 %}Refused{% elif status == 401 %}Sign in first{% else %}Error {{ status }}{% endif %}</h1>
<p class="note">{{ message }}</p>
<p><a href="/">Back to the overview</a></p>
{% endblock %}
