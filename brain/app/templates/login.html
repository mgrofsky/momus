{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="narrow">
<h1>Sign in</h1>
{% if error %}<p class="flash err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <input type="hidden" name="csrf" value="{{ pre }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <label>Username <input name="username" autocomplete="username" required maxlength="64"></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
  <button>Sign in</button>
</form>
{% if bootstrap_open %}<p class="note">No account exists yet. Use the one-time token from the container log on the <a href="/bootstrap">first-run page</a>.</p>{% endif %}
</section>
{% endblock %}
